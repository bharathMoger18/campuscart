# ============================================================
# nginx.conf — CampusCart (Docker version)
# 
# KEY DIFFERENCES from local nginx config:
#   1. proxy_pass uses 'web' (service name) not '127.0.0.1'
#   2. static files come from Docker volume, not hardcoded path
#   3. frontend served from /usr/share/nginx/html (bind mounted)
#   4. Added WebSocket upgrade headers for Django Channels
#   5. Added /admin/ location block
#   6. Rate limiting for API protection
# ============================================================

# Rate limiting zone
# $binary_remote_addr = client IP in binary format (compact)
# zone=api:10m = shared memory zone named 'api', 10MB storage
# 10MB can store ~160,000 IPs
# rate=10r/s = max 10 requests per second per IP
limit_req_zone $binary_remote_addr zone=api:10m rate=10r/s;

server {
    listen 80;
    server_name localhost;
    # Docker's internal DNS resolver
    # Tells Nginx to use Docker's embedded DNS at 127.0.0.11
    # resolver directive + variable prevents startup-time DNS failure
    resolver 127.0.0.11 valid=30s;
    set $upstream_web web;
    # Security: hide Nginx version from response headers
    server_tokens off;

    # ── Compression ─────────────────────────────────────────
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml;
    gzip_min_length 1000;
    gzip_comp_level 5;

    # ── Security Headers ─────────────────────────────────────
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header X-Frame-Options "SAMEORIGIN";

    # ── Upload size limit ────────────────────────────────────
    # Products have image uploads — allow up to 10MB
    client_max_body_size 10M;

    # ── Timeout settings ─────────────────────────────────────
    proxy_connect_timeout 60s;
    proxy_read_timeout 60s;
    proxy_send_timeout 60s;

    # ── Frontend — HTML/CSS/JS files ─────────────────────────
    # These are served DIRECTLY by Nginx (no Django involved)
    # Files come from bind mount in docker-compose.yml:
    #   - ./frontend:/usr/share/nginx/html:ro
    # 'ro' = read-only mount — Nginx only reads, never writes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ =404;
    }

    # ── Django REST API ──────────────────────────────────────
    # All /api/ requests go to Django container
    #
    # CRITICAL DOCKER CONCEPT:
    # 'web' is the SERVICE NAME in docker-compose.yml
    # Docker's embedded DNS (at 127.0.0.11) resolves 'web'
    # to the Django container's IP on the Docker bridge network
    # This is how containers talk to each other — by name, not IP
    location /api/ {
        # Rate limiting: allow burst of 20 requests, no delay
        limit_req zone=api burst=20 nodelay;

        proxy_pass http://$upstream_web:8000;
        proxy_http_version 1.1;

        # Clear Connection header for upstream keepalive
        proxy_set_header Connection "";

        # Pass real client info to Django
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── WebSockets — Django Channels (Chat + Push) ───────────
    # WebSocket connections use HTTP Upgrade mechanism:
    # Client sends: "Upgrade: websocket" header
    # Nginx must forward this Upgrade header to Django
    #
    # proxy_set_header Upgrade $http_upgrade
    #   → passes the "Upgrade: websocket" header through
    # proxy_set_header Connection "upgrade"
    #   → tells upstream to keep connection open (not close it)
    #
    # Without these headers, WebSocket handshake fails and
    # Django Channels chat/push notifications break completely
    location /ws/ { 
        proxy_pass http://$upstream_web:8000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # WebSocket connections are long-lived (minutes/hours)
        # These timeouts prevent Nginx from killing idle connections
        proxy_read_timeout 86400s;
        proxy_send_timeout 86400s;
    }

    # ── Django Admin ─────────────────────────────────────────
    # Admin should be proxied to Django, not served statically
    location /admin/ {
        proxy_pass http://$upstream_web:8000;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # ── Static Files — Django admin CSS, DRF, Spectacular ────
    # collectstatic puts files into /app/staticfiles/ in Django container
    # A Docker named volume 'static_volume' is shared between
    # web container (writes) and nginx container (reads)
    # Mount point in Nginx container: /app/staticfiles/
    location /static/ {
        alias /app/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    # ── Media Files — User uploaded product images ────────────
    # media/ is a Docker named volume shared between containers
    # Django writes uploaded images to /app/media/
    # Nginx reads and serves them directly (no Django involved)
    # Serving media through Nginx is much faster than through Django
    location /media/ {
        alias /app/media/;
        expires 7d;
        add_header Cache-Control "public";
    }
}
